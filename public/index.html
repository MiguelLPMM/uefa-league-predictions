<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA League Predictions</title>
    <link rel="stylesheet" href="style.css">

    <script src="js/main.js"></script>  <!-- Link to external script -->
</head>
<body>
    <nav>
        <h1>UEFA League Predictions</h1>
    </nav>
    <div class="container">
        <div id="league-table">
            <table>
                <thead>
                    <tr>
                        <th>Team</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- League table will be dynamically updated here -->
                </tbody>
            </table>
        </div>

        <div id="matches">
            <!-- Matches will be dynamically updated here -->
        </div>
    </div>
</body>
</html>
