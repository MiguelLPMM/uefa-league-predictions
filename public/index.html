<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA League Predictions</title>
    <link rel="icon" href="assets/ucl.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

    <script src="vendor/supabase.js"></script>  <!-- Vendored Supabase client library (UMD, sets window.supabase) -->
    <script type="module" src="js/main.js"></script>  <!-- Pulls in supabaseClient/theme/compSelector/auth/nav via imports -->

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0230f7">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UEFA Predictions">
</head>
<body>
    <nav>
        <div class="left">
            <button id="hamburger-toggle" class="copy-btn" aria-expanded="false" aria-controls="sidebar" aria-label="Open menu">
                <i class="material-icons">menu</i>
            </button>
            <button class="comp-button" data-arg="ucl">
                <img src="assets/ucl-dark.ico" alt="UCL">
            </button>
            <button class="comp-button" data-arg="uel">
                <img src="assets/uel-dark.ico" alt="UEL">
            </button>
            <button class="comp-button" data-arg="uecl">
                <img src="assets/uecl-dark.ico" alt="UECL">
            </button>
        </div>
        <div class="center">
            <h1 id="header"><span class="title-part1">UEFA Champions</span> <span class="title-part2">League Predictions</span></h1>
        </div>
        <div class="right">
            <button id="load-predictions" class="copy-btn" title="Load saved predictions" hidden>
                <i class="material-icons">restore</i>
            </button>
            <button id="save-predictions" class="copy-btn" title="Save predictions" hidden>
                <i class="material-icons">save</i>
            </button>
            <button id="clear-predictions" class="copy-btn" title="Reset unplayed matches">
                <i class="material-icons">refresh</i>
            </button>
            <button id="copy-standings" class="copy-btn" title="Copy standings to clipboard">
                <i class="material-icons">content_copy</i>
            </button>
        </div>
    </nav>
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
    <aside id="sidebar" class="sidebar" aria-hidden="true">
        <button id="sidebar-close" class="sidebar-close" aria-label="Close menu">
            <i class="material-icons">close</i>
        </button>
        <div class="sidebar-links">
            <a id="nav-predictions" href="index.html">Predictions</a>
            <a id="nav-leaderboard" href="leaderboard.html">Leaderboard</a>
            <a id="nav-admin" href="admin.html" hidden>Admin</a>
        </div>
        <div class="sidebar-account">
            <button id="sidebar-signin" class="sidebar-account-btn">
                <i class="material-icons">login</i> Sign in with Google
            </button>
            <div id="sidebar-user" class="sidebar-user" hidden>
                <img id="sidebar-user-avatar" alt="" />
                <span id="sidebar-user-name"></span>
                <button id="sidebar-signout" class="sidebar-account-btn">
                    <i class="material-icons">logout</i> Sign out
                </button>
            </div>
        </div>
    </aside>
    <div class="container">
        <div id="table-panel">
            <div class="panel-header">
                <button id="toggle-table" class="panel-toggle" title="Collapse standings" aria-expanded="true" aria-label="Collapse standings">
                    <i class="material-icons">chevron_left</i>
                </button>
            </div>
            <div id="league-table">
                <table>
                    <thead>
                        <tr>
                            <th></th> <!-- Position -->
                            <th></th> <!-- Logo -->
                            <th></th> <!-- Team Name -->
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>GD</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- League table will be dynamically updated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="matches">
            <!-- Matches will be dynamically updated here -->
        </div>
    </div>
    <div id="loading-indicator">Loading matches...</div>
    <div id="notification" class="notification"></div>
</body>
</html>
