<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA League Predictions</title>
    <link rel="stylesheet" href="style.css">

    <script src="js/main.js"></script>  <!-- Link to external script -->

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <nav>
        <div class="left">
            <!-- Future elements can be added here -->
        </div>
        <div class="center">
            <h1>UEFA League Predictions</h1>
        </div>
        <div class="right">
            <button id="copy-standings" class="copy-btn">
                <i class="material-icons">content_copy</i>
            </button>
        </div>
    </nav>
    <div class="container">
        <div id="league-table">
            <table>
                <thead>
                    <tr>
                        <th></th> <!-- Position -->
                        <th></th> <!-- Logo -->
                        <th></th> <!-- Team Name -->
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- League table will be dynamically updated here -->
                </tbody>
            </table>
        </div>

        <div id="matches">
            <!-- Matches will be dynamically updated here -->
        </div>
    </div>
    <div id="notification" class="notification"></div>
</body>
</html>
